<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Nordic BLE capture workflow</title>
  <desc id="desc">Nearby Bluetooth LE devices transmit packets. A PCA10059 dongle running Nordic sniffer firmware captures them. The Windows nrfutil ble-sniffer tool reads USB serial data and passes packets to Wireshark.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#7c91a9"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .heading { font-size: 30px; font-weight: 700; fill: #152b46; }
      .label { font-size: 20px; font-weight: 700; fill: #152b46; text-anchor: middle; }
      .body { font-size: 16px; fill: #52677f; text-anchor: middle; }
      .code { font-family: Consolas, monospace; font-size: 16px; fill: #246389; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="400" rx="20" fill="#f3f7fc"/>
  <text x="40" y="41" font-size="12" font-weight="700" letter-spacing="2" fill="#21789d">BLE CAPTURE WORKFLOW</text>
  <text x="40" y="79" class="heading">From nearby BLE devices to Wireshark</text>
  <g fill="#fff" stroke="#dce5ef" stroke-width="1.5">
    <rect x="40" y="112" width="250" height="208" rx="14"/>
    <rect x="330" y="112" width="250" height="208" rx="14"/>
    <rect x="620" y="112" width="250" height="208" rx="14"/>
    <rect x="910" y="112" width="250" height="208" rx="14"/>
  </g>
  <g fill="none" stroke="#7c91a9" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M299 210H319"/><path d="M589 210H609"/><path d="M879 210H899"/>
  </g>
  <g fill="#eaf4fb">
    <circle cx="165" cy="193" r="47"/><circle cx="455" cy="193" r="47"/>
    <circle cx="745" cy="193" r="47"/><circle cx="1035" cy="193" r="47"/>
  </g>
  <rect x="149" y="165" width="32" height="56" rx="6" fill="#fff" stroke="#21789d" stroke-width="3"/>
  <path d="M157 173H173M161 213H169" stroke="#21789d" stroke-width="2"/>
  <g fill="none" stroke="#54a6c6" stroke-width="2.5" stroke-linecap="round">
    <path d="M188 181Q201 193 188 205M196 173Q217 193 196 213"/>
    <path d="M142 181Q129 193 142 205M134 173Q113 193 134 213"/>
  </g>
  <rect x="419" y="181" width="24" height="26" rx="3" fill="#dfe5e9" stroke="#7c91a9"/>
  <path d="M424 184V204M430 184V204M436 184V204" stroke="#d5ac45" stroke-width="3"/>
  <rect x="442" y="176" width="57" height="36" rx="5" fill="#2b785d"/>
  <rect x="451" y="183" width="19" height="20" rx="2" fill="#213a35"/>
  <circle cx="485" cy="186" r="3" fill="#a0e7b7"/>
  <rect x="699" y="166" width="92" height="60" rx="6" fill="#173a58"/>
  <circle cx="708" cy="175" r="2" fill="#7dc8e3"/><circle cx="716" cy="175" r="2" fill="#7dc8e3"/>
  <text x="713" y="201" font-family="Consolas, monospace" font-size="23" fill="#a1e2f4">&gt;_</text>
  <path d="M715 213H764" stroke="#6699b8" stroke-width="3"/>
  <rect x="989" y="164" width="92" height="58" rx="5" fill="#fff" stroke="#21789d" stroke-width="3"/>
  <rect x="997" y="173" width="76" height="11" rx="3" fill="#daf0db"/>
  <text x="1003" y="182" font-size="10" fill="#286343">btle</text>
  <path d="M998 193H1071M998 202H1071M998 211H1054M1035 223V230M1018 231H1052" stroke="#86aac0" stroke-width="2"/>
  <text x="165" y="264" class="label">BLE devices</text>
  <text x="165" y="290" class="body">Advertising and connections</text>
  <text x="455" y="264" class="label">nRF52840 Dongle</text>
  <text x="455" y="290" class="body">PCA10059 · Nordic firmware</text>
  <text x="745" y="264" class="label">Windows host tool</text>
  <text x="745" y="290" class="code">nrfutil ble-sniffer</text>
  <text x="1035" y="264" class="label">Wireshark</text>
  <text x="1035" y="290" class="body">Decode, inspect, and filter</text>
  <text x="600" y="365" class="body">USB serial connects the dongle to the host tool. Wireshark receives packets through its extcap interface.</text>
</svg>
